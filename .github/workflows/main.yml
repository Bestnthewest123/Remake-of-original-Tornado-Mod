name: Build Weather and Tornadoes

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Find and extract project ZIP
        shell: bash
        run: |
          ZIP_FILE="TornadoMod_fixed2.zip"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in the repository root."
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          BUILD_FILE=$(find extracted -type f -name build.gradle -print -quit)
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: Could not find build.gradle inside the ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"

      - name: Install Gradle 2.14.1
        shell: bash
        run: |
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-2.14.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-2.14.1/bin" >> "$GITHUB_PATH"

      - name: Build the mod
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon clean build --stacktrace

      - name: Upload compiled JAR if build succeeds
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Weather-and-Tornadoes-v0.1-Alpha
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
